config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=1.5.0"

profile: jaffle_shop

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  "dbt_date:time_zone": "America/Los_Angeles"

seeds:
  jaffle_shop:
    +schema: raw
    jaffle-data:
      +enabled: true
      raw_orders:
        +column_types:
          id: string
          customer: string
          ordered_at: string
          store_id: string
          subtotal: string
          tax_paid: string
          order_total: string
      raw_stores:
        +column_types:
          id: string
          name: string
          opened_at: string
          tax_rate: string
      raw_supplies:
        +column_types:
          id: string
          name: string
          cost: string
          perishable: string
          sku: string
      raw_products:
        +column_types:
          sku: string
          name: string
          type: string
          price: string
          description: string
      raw_items:
        +column_types:
          id: string
          order_id: string
          sku: string

models:
  jaffle_shop:
    staging:
      +materialized: view
    marts:
      +materialized: table

unit_tests:
  jaffle_shop:
    # Disabled: dbt-clickzetta 1.7.0 bug — unit test cleanup uses DROP TABLE on VIEW relations
    # Tracked: https://github.com/clickzetta/dbt-clickzetta/issues/5
    +enabled: false
